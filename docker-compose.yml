version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database (Persistent with Healthcheck)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: muhtasham_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_muhtasham_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-muhtasham_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Muhtasham AI Agent (Monitor, Bot, AI Evaluator, Scheduler)
  # ----------------------------------------------------------------------------
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: muhtasham_agent
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-secure_muhtasham_password_2026}@db:5432/${POSTGRES_DB:-muhtasham_db}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    volumes:
      - ./logs:/app/logs
      - ./temp_media:/app/temp_media
      - ./backups:/backups

volumes:
  postgres_data:
    driver: local
